services:
  backend:
    build: ./back
    image: my-backend
    ports:
      - "5001:5000"
    volumes:
      - ./back:/app
    environment:
      - PYTHONUNBUFFERED=1
      - USE_LLM_GENERATOR
      - GEMINI_API_KEY
      - GEMINI_API_KEY_GENERATOR
      - GEMINI_API_KEY_JUDGE
    networks:
      - app-network

  frontend:
    build: ./front
    image: my-frontend
    ports:
      - "5173:5173"
    volumes:
      - ./front:/app
      - /app/node_modules # Evita que los módulos locales sobrescriban los del contenedor
    environment:
      - VITE_API_URL=http://localhost:5001
    depends_on:
      - backend
    networks:
      - app-network

networks:
  app-network:
    driver: bridge